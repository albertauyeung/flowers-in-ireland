<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Flowers in Ireland app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5d8"/>
      <stop offset="55%" stop-color="#fef0f4"/>
      <stop offset="100%" stop-color="#fffaea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stem and leaves -->
  <g transform="translate(256 256)">
    <path d="M0 30 Q-4 80 0 150" stroke="#3d8b41" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M0 80 Q-50 60 -70 100 Q-40 110 0 95 Z" fill="#6ab04c"/>
    <path d="M0 120 Q50 105 70 140 Q40 152 0 132 Z" fill="#79c47a"/>
  </g>
  <!-- Daisy-like flower -->
  <g transform="translate(256 200)">
    <g fill="#ffffff" stroke="#d6336c" stroke-width="3">
      <ellipse cx="0" cy="-70" rx="26" ry="44"/>
      <ellipse cx="50" cy="-50" rx="26" ry="44" transform="rotate(45 50 -50)"/>
      <ellipse cx="70" cy="0" rx="26" ry="44" transform="rotate(90 70 0)"/>
      <ellipse cx="50" cy="50" rx="26" ry="44" transform="rotate(135 50 50)"/>
      <ellipse cx="0" cy="70" rx="26" ry="44"/>
      <ellipse cx="-50" cy="50" rx="26" ry="44" transform="rotate(45 -50 50)"/>
      <ellipse cx="-70" cy="0" rx="26" ry="44" transform="rotate(90 -70 0)"/>
      <ellipse cx="-50" cy="-50" rx="26" ry="44" transform="rotate(135 -50 -50)"/>
    </g>
    <circle cx="0" cy="0" r="38" fill="#f9ca24"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#b88800" stroke-width="3"/>
  </g>
</svg>
